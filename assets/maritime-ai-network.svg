<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Six connected MarineDesk maritime divisions</title>
<desc id="desc">An illustrated vessel at the center connects to six named divisions: Procurement, Operations, Crewing, Technical, Dry Dock, and Marine Superintendent. Supplier Cloud is shown as part of Procurement. Conceptual ecosystem only.</desc>
<defs><linearGradient id="sea" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07172B"/><stop offset=".58" stop-color="#0A2742"/><stop offset="1" stop-color="#123C58"/></linearGradient><radialGradient id="aura"><stop stop-color="#28D7FF" stop-opacity=".18"/><stop offset="1" stop-color="#28D7FF" stop-opacity="0"/></radialGradient><linearGradient id="route"><stop stop-color="#28D7FF" stop-opacity=".3"/><stop offset=".5" stop-color="#28D7FF" stop-opacity=".9"/><stop offset="1" stop-color="#28D7FF" stop-opacity=".3"/></linearGradient><pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0v42" fill="none" stroke="#FFFFFF" stroke-opacity=".04"/></pattern></defs><style>@keyframes route-dash{to{stroke-dashoffset:-104}}@keyframes point-pulse{0%,100%{opacity:.55}50%{opacity:1}}.data-flow{animation:route-dash 18s linear infinite}.pulse{animation:point-pulse 3.2s ease-in-out infinite}.delay1{animation-delay:.7s}.delay2{animation-delay:1.3s}.delay3{animation-delay:2s}@media(prefers-reduced-motion:reduce){.data-flow,.pulse{animation:none!important}}</style>
<rect x="8" y="8" width="1184" height="704" rx="30" fill="url(#sea)" stroke="#FFFFFF" stroke-opacity=".12"/><rect x="8" y="8" width="1184" height="704" rx="30" fill="url(#grid)"/><circle cx="600" cy="363" r="285" fill="url(#aura)"/>
<text x="54" y="61" fill="#28D7FF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="2.3">ONE MARITIME INTELLIGENCE PLATFORM · SIX CONNECTED DIVISIONS</text>
<g fill="none" stroke="url(#route)" stroke-width="1.7" stroke-dasharray="5 8" class="data-flow"><path d="M314 213C410 213 430 295 503 336"/><path d="M886 213C790 213 770 295 697 336"/><path d="M314 363H493"/><path d="M886 363H707"/><path d="M314 513C410 513 430 431 503 390"/><path d="M886 513C790 513 770 431 697 390"/></g>
<g fill="#28D7FF"><circle class="pulse" cx="493" cy="336" r="4"/><circle class="pulse delay1" cx="707" cy="336" r="4"/><circle class="pulse delay2" cx="493" cy="390" r="4"/><circle class="pulse delay3" cx="707" cy="390" r="4"/></g>
<!-- division cards -->
<g fill="#07172B" fill-opacity=".92" stroke="#28D7FF" stroke-opacity=".47" stroke-width="1.3">
<rect x="44" y="164" width="270" height="98" rx="15"/><rect x="886" y="164" width="270" height="98" rx="15"/><rect x="44" y="314" width="270" height="98" rx="15"/><rect x="886" y="314" width="270" height="98" rx="15"/><rect x="44" y="464" width="270" height="98" rx="15"/><rect x="886" y="464" width="270" height="98" rx="15"/></g>
<!-- procurement icon --> <g transform="translate(66 190)" fill="none" stroke="#FFFFFF" stroke-width="2.1" stroke-linejoin="round"><path d="M0 0h29v38H0zM7 9h15M7 17h15M7 25h9"/><path d="M32 27l6 6 11-14" stroke="#28D7FF"/></g><text x="126" y="207" fill="#FFFFFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="650">Procurement</text><text x="126" y="229" fill="#AFC3D3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">RFQ and quotations</text><text x="126" y="247" fill="#28D7FF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" letter-spacing=".5">SUPPLIER CLOUD · CONNECTED</text>
<!-- operations icon --> <g transform="translate(908 190)" fill="none" stroke="#FFFFFF" stroke-width="2"><path d="M0 23c0-12 9-21 21-21 7 0 13 3 17 8M38 2v10H28M38 17c0 12-9 21-21 21-7 0-13-3-17-8M0 38V28h10"/><circle cx="19" cy="20" r="4" fill="#28D7FF" stroke="none"/></g><text x="960" y="207" fill="#FFFFFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="650">Operations</text><text x="960" y="229" fill="#AFC3D3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">Vessel / chartering</text>
<!-- crewing icon --> <g transform="translate(66 338)" fill="none" stroke="#FFFFFF" stroke-width="2"><circle cx="16" cy="9" r="7"/><path d="M2 38c1-11 5-17 14-17s13 6 14 17"/><path d="M3 31h26" stroke="#28D7FF"/></g><text x="126" y="357" fill="#FFFFFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="650">Crewing</text><text x="126" y="379" fill="#AFC3D3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">Crew readiness</text>
<!-- technical icon --> <g transform="translate(908 338)" fill="none" stroke="#FFFFFF" stroke-width="2"><path d="M17 1v7m0 22v7M1 19h7m18 0h7M5.5 7.5l5 5m13 13 5 5m0-23-5 5m-13 13-5 5"/><circle cx="17" cy="19" r="9" stroke="#28D7FF"/><circle cx="17" cy="19" r="3"/></g><text x="960" y="357" fill="#FFFFFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="650">Technical</text><text x="960" y="379" fill="#AFC3D3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">Maintenance plans</text>
<!-- dry dock icon --> <g transform="translate(66 489)" fill="none" stroke="#FFFFFF" stroke-width="2"><path d="M0 25h36l-6 10H7zM8 24V10h20v14M3 40h31M8 44h21"/><path d="M4 5h31" stroke="#28D7FF"/></g><text x="126" y="507" fill="#FFFFFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="650">Dry Dock</text><text x="126" y="529" fill="#AFC3D3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">Docking periods</text>
<!-- marine sep neutral mark --> <g transform="translate(908 488)" fill="none" stroke="#FFFFFF" stroke-width="2"><circle cx="18" cy="18" r="16"/><path d="M18 6v24M6 18h24" stroke="#28D7FF"/><circle cx="18" cy="18" r="4" fill="#07172B"/></g><text x="960" y="507" fill="#FFFFFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="650">Marine Superintendent</text><text x="960" y="529" fill="#AFC3D3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">Scope to be confirmed</text>
<!-- vessel hub -->
<circle cx="600" cy="363" r="101" fill="#07172B" stroke="#28D7FF" stroke-opacity=".7" stroke-width="1.5"/><circle cx="600" cy="363" r="87" fill="none" stroke="#FFFFFF" stroke-opacity=".12" stroke-dasharray="2 8"/><g transform="translate(542 329)" fill="none" stroke="#FFFFFF" stroke-width="2.8" stroke-linejoin="round"><path d="M0 36h116l-17 28H17z"/><path d="M27 36V13h43v23M40 13V0h18v13M77 36V23h18v13"/><path d="M8 81c13 8 25 8 38 0s25-8 38 0 25 8 38 0" stroke="#28D7FF" stroke-linecap="round"/></g><text x="600" y="432" fill="#AFC3D3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" text-anchor="middle" letter-spacing="1.2">VESSEL · SHARED CONTEXT</text>
<text x="600" y="652" fill="#8199AA" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" text-anchor="middle" letter-spacing="1.4">CONCEPTUAL ECOSYSTEM · PRODUCT STATUS VARIES BY DIVISION</text>
</svg>


